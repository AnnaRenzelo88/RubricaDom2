<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rubrica di Anna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
  <body>


<!--HEADER-->

<header class="container">
        <div class="row">
    <div class="col-12">
        <h1 class="text-center mt-3">Rubrica di Anna</h1>
    </div>
        </div>
</header>


<!--BOTTONI-->

<section class="container-fluid my-5">

    <div class="row">

        <article class="col-12 col-md-4">
        <div class="row">
        <div class="col-12 text-center">
        <h3  class="text-center">Mostra contatti</h3>
        <button id="mostraContatti">Mostra</button>
        </div>
        </div>
        </article>


        <article class="col-12 col-md-4">
        <div class="row">
        <div class="col-12 text-center">
        <h3 class="text-center">Aggiungi nuovo contatto</h3>
        <input id="inputNome" class="text-center justify-content-start" type="text" placeholder="Inserisci nome" value class="text-center justify-content-start">
        <input id= "inputNumero" class="text-center justify-content-start" type="text" placeholder="Inserisci numero" value class="text-center justify-content-start">
        <button id="addBtn" class="mt-2">Aggiungi</button>
        </div>
        </div>
        </article>

        
        <article class="col-12 col-md-4">
        <div class="row">
        <div class="col-12 text-center">
        <h3 class="text-center">Modifica contatto</h3> 
        <input id="modificaNome" class ="text-center" type="text" placeholder="Inserisci nome">
        <input id="modificaNumero" class="text-center" type="text" placeholder="Inserisci nuovo numero">
        <button id="editBtn" class="mt-2">Modifica</button>
        </div>
        </div>
        </article>
        
    </div>

    <section class="container-fluid">
        <h3 class="text-center mt-5">I miei contatti</h3>
        <div class="row justify-content-center mt-5">
        <article id="colonnaContatti" class="col-8">
        




        </article>


        </div>





    </section>

</section>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
