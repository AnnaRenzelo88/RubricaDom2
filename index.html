<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rubrica di Anna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   
    <link rel="stylesheet" href="style.css">
</head>
  <body>


<!--HEADER-->

<header class="container">
        <div class="row">
    <div class="col-12">
        <h1 class="text-center mt-3">Rubrica di Anna</h1>
    </div>
        </div>
</header>


<!--BOTTONI-->

<section class="container-fluid my-5">
    <div class="row">
        <article class="col-12 col-md-4">
        <h3 class="text-center">Mostra contatti</h3>
        <button>Mostra</button>
        </article>

        <article class="col-12 col-md-4">
        <h3 class="text-center">Aggiungi contatto</h3>
        <button>Aggiungi</button>
        </article>

        <article class="col-12 col-md-4">
        <h3 class="text-center">Cerca contatto</h3> 
        <input type="inserisci" placeholder="Inserisci contatto"><button class="ms-2">Cerca</button>
        </article>
        
    </div>

    <section class="container-fluid">
        <div class="row mt-5">
        <article class="col-12">
        <h3 class="text-center">I miei contatti</h3>
        </article>


        </div>





    </section>

</section>

</html>
